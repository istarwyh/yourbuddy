# Local endpoint and isolated-path patch over the shipped headless profile.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-deepseek
  config:
    baseURL: !!js process.env.DSH_SNAPSHOT_BASE_URL
    thinking: enabled
    reasoningEffort: low
    # Heartbeat deadlines use fake clocks in llm-deepseek/tests/runtime.spec.ts;
    # this real-process integration keeps the provider's normal idle budget.

- id: agent-loop
  config:
    agents:
      - id: main
        provider: deepseek-official
        model: deepseek-v4-flash
        cwd: !!js process.cwd()

- id: agent-instructions
  disabled: true

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none
