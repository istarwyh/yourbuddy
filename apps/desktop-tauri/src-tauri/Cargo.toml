[package]
name = "yourbuddy"
version = "0.4.6"
description = "YourBuddy desktop AI workbench (Tauri)"
authors = ["XIAOHUI", "DeepSeek"]
edition = "2021"

[lib]
name = "yourbuddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
rustls-pemfile = "2"
x509-parser = "0.18"
sha2 = "0.10"
hex = "0.4"
zip = "2"
dirs = "6"
which = "6"
futures-util = "0.3"
flate2 = "1"
tar = "0.4"
zstd = "0.13"
minisign-verify = "0.2.5"
tauri-plugin-updater = "2"
url = "2"
sys-locale = "0.3"
cookie = "0.18"
tempfile = "3"

[dev-dependencies]
toml = "0.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
macos-accessibility-client = "0.0.2"
objc2 = "0.6"
objc2-foundation = "0.3.2"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["UNNotificationSettings", "UNUserNotificationCenter", "block2"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 8
