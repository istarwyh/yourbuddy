<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YourBuddy</title>
  <style>
    :root {
      --dsw-static-neutral-bluish-50: rgb(249, 250, 251);
      --dsw-static-neutral-bluish-800: rgb(53, 54, 56);
      --dsw-static-neutral-bluish-875: rgb(35, 35, 36);
      --dsw-static-neutral-bluish-950: rgb(21, 21, 23);
      --dsw-static-red-400: rgb(242, 90, 90);
      --bg: var(--dsw-static-neutral-bluish-950);
      --line: var(--dsw-static-neutral-bluish-800);
      --text: var(--dsw-static-neutral-bluish-50);
      --hover: var(--dsw-static-neutral-bluish-875);
      --close-hover: var(--dsw-static-red-400);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: row;
    }
    #window-rail {
      position: relative;
      z-index: 10;
      width: 32px;
      min-width: 32px;
      height: 100%;
      border-right: 1px solid var(--line);
      background: var(--bg);
      user-select: none;
    }
    #window-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      padding-top: 4px;
    }
    button.ctl {
      appearance: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 31px;
      height: 32px;
      border: 0;
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }
    button.ctl:hover { background: var(--hover); }
    button.ctl.close:hover { background: var(--close-hover); color: #fff; }
    button.ctl svg { width: 10px; height: 10px; display: block; }
    body.macos #window-controls {
      gap: 8px;
      padding-top: 14px;
    }
    body.macos button.ctl {
      width: 12px;
      height: 12px;
      flex: 0 0 12px;
      border-radius: 50%;
    }
    body.macos button.ctl svg { display: none; }
    body.macos button.ctl.close { background: #ff5f57; }
    body.macos button.ctl.minimize { background: #febc2e; }
    body.macos button.ctl.maximize { background: #28c840; }
    body.macos button.ctl:hover { filter: brightness(1.08); }
    iframe {
      flex: 1 1 auto;
      width: 100%;
      min-width: 0;
      height: 100%;
      border: 0;
      background: var(--bg);
    }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      --dsw-static-neutral-bluish-00: rgb(255, 255, 255);
      --dsw-static-neutral-bluish-1000: rgb(15, 17, 21);
      --dsw-static-neutral-bluish-700: rgb(97, 102, 107);
      --dsw-static-neutral-bluish-750: rgb(67, 69, 74);
      --dsw-alias-bg-mask-1: rgba(0, 0, 0, 0.24);
      --dsw-alias-bg-layer-2: rgb(255, 255, 255);
      --dsw-alias-label-primary: rgb(15, 17, 21);
      --dsw-alias-label-secondary: rgb(97, 102, 107);
      --dsw-alias-label-primary-foreground: rgb(255, 255, 255);
      --dsw-alias-button-primary-fill: rgb(15, 17, 21);
      --dsw-alias-button-primary-hover: rgb(67, 69, 74);
      --dsw-alias-border-l2: rgba(0, 0, 0, 0.1);
      --dsw-alias-interactive-bg-hover: rgba(38, 49, 72, 0.06);
      --dsw-mask-blur: blur(2px);
      --dsw-shadow-lv3: 0 0 1px 0 rgba(0, 0, 0, 0.2), 0 0 4px 0 rgba(0, 0, 0, 0.02), 0 12px 32px 0 rgba(0, 0, 0, 0.08);
    }
    .modal[hidden] { display: none; }
    .modal-mask {
      position: absolute;
      inset: 0;
      background: var(--dsw-alias-bg-mask-1);
      backdrop-filter: var(--dsw-mask-blur);
    }
    .modal-card {
      position: relative;
      z-index: 1;
      width: min(380px, 100%);
      padding: 0 0 24px;
      border-radius: 24px;
      background: var(--dsw-alias-bg-layer-2);
      box-shadow: var(--dsw-shadow-lv3);
      color: var(--dsw-alias-label-primary);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 22px 14px 12px 24px;
    }
    .modal-header h2 {
      margin: 0;
      font-size: 16px;
      line-height: 24px;
      font-weight: 500;
    }
    .modal-x {
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--dsw-alias-label-secondary);
      cursor: pointer;
    }
    .modal-x:hover { background: var(--dsw-alias-interactive-bg-hover); }
    .modal-desc {
      margin: 0;
      padding: 0 24px;
      font-size: 14px;
      line-height: 22px;
      color: var(--dsw-alias-label-primary);
    }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 20px 24px 0;
    }
    .btn {
      height: 36px;
      padding: 0 14px;
      border: 0;
      border-radius: 18px;
      font-size: 14px;
      line-height: 22px;
      cursor: pointer;
    }
    .btn.outline {
      border: 1px solid var(--dsw-alias-border-l2);
      background: transparent;
      color: var(--dsw-alias-label-primary);
    }
    .btn.outline:hover { background: var(--dsw-alias-interactive-bg-hover); }
    .btn.primary {
      background: var(--dsw-alias-button-primary-fill);
      color: var(--dsw-alias-label-primary-foreground);
    }
    .btn.primary:hover { background: var(--dsw-alias-button-primary-hover); }
  </style>
</head>
<body>
  <aside id="window-rail" data-tauri-drag-region>
    <div id="window-controls"></div>
  </aside>
  <iframe id="app" title="YourBuddy"></iframe>
  <div id="close-prompt" class="modal" hidden>
    <div class="modal-mask" data-dismiss></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="close-title">
      <div class="modal-header">
        <h2 id="close-title" data-i18n="shell.closeTitle">关闭窗口</h2>
        <button type="button" class="modal-x" data-dismiss data-i18n-aria="shell.cancel" aria-label="取消">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M3 3 L11 11 M11 3 L3 11" stroke="currentColor" stroke-width="1.4"/>
          </svg>
        </button>
      </div>
      <p class="modal-desc" data-i18n="shell.closeDesc">下次将记住这个选择，可在托盘菜单里改回。</p>
      <div class="modal-footer">
        <button type="button" class="btn outline" id="close-exit" data-i18n="shell.exit">退出程序</button>
        <button type="button" class="btn primary" id="close-minimize" data-i18n="shell.minimizeTray">最小化到托盘</button>
      </div>
    </div>
  </div>
  <script src="desktop-i18n.js"></script>
  <script>
    window.DSH_I18N.apply()
    const icons = {
      minimize: '<svg viewBox="0 0 10 10" aria-hidden="true"><rect x="1" y="5" width="8" height="1" fill="currentColor"/></svg>',
      maximize: '<svg viewBox="0 0 10 10" aria-hidden="true"><rect x="1.5" y="1.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1"/></svg>',
      close: '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2 L8 8 M8 2 L2 8" stroke="currentColor" stroke-width="1.2"/></svg>',
    }
    const labels = {
      minimize: window.DSH_I18N.t('shell.min'),
      maximize: window.DSH_I18N.t('shell.max'),
      close: window.DSH_I18N.t('shell.close'),
    }

    function windowButton(kind) {
      const el = document.createElement('button')
      el.className = `ctl ${kind}`
      el.type = 'button'
      el.innerHTML = icons[kind]
      el.title = labels[kind]
      el.setAttribute('aria-label', labels[kind])
      el.addEventListener('click', async () => {
        const current = window.__TAURI__?.window?.getCurrentWindow()
        if (!current) return
        if (kind === 'minimize') await current.minimize()
        if (kind === 'maximize') await current.toggleMaximize()
        if (kind === 'close') await current.close()
      })
      return el
    }

    function renderWindowControls(layout) {
      document.body.classList.toggle('macos', layout.os === 'macos')
      const controls = [...layout.left, ...layout.right]
      document.getElementById('window-controls').replaceChildren(...controls.map(windowButton))
    }

    const closePrompt = document.getElementById('close-prompt')
    function setClosePrompt(open) {
      closePrompt.hidden = !open
    }
    async function chooseClose(action) {
      setClosePrompt(false)
      const invoke = window.__TAURI__?.core?.invoke
      if (invoke) await invoke('set_close_action', { action })
    }
    closePrompt.querySelectorAll('[data-dismiss]').forEach((el) => {
      el.addEventListener('click', () => setClosePrompt(false))
    })
    document.getElementById('close-minimize').onclick = () => chooseClose('minimize')
    document.getElementById('close-exit').onclick = () => chooseClose('exit')
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !closePrompt.hidden) setClosePrompt(false)
    })
    window.__DSH_CLOSE_PROMPT__ = {
      show() { setClosePrompt(true) },
      hide() { setClosePrompt(false) },
    }

    const appFrame = document.getElementById('app')
    const desktopLifecycleChannel = 'yourbuddy.desktop.lifecycle'
    const desktopLifecycleVersion = 1
    const desktopLifecycleRequestId = /^[A-Za-z0-9_-]{1,64}$/
    const networkProxyChannel = 'yourbuddy.desktop.network-proxy'
    const networkProxyVersion = 3
    const externalLinkChannel = 'yourbuddy.desktop.external-link'
    const externalLinkVersion = 1
    const marketplaceLinkChannel = 'yourbuddy.desktop.marketplace-link'
    const marketplaceLinkVersion = 1
    let embeddedOrigin
    try {
      embeddedOrigin = new URL(window.__DSH_WEB_URL__).origin
    }
    catch {
      embeddedOrigin = undefined
    }

    function readDesktopLifecycleAction(value) {
      if (value === null || typeof value !== 'object' || Array.isArray(value)) return false
      const keys = Object.keys(value).sort()
      if (keys.join(',') !== 'channel,requestId,type,version') return false
      if (value.channel !== desktopLifecycleChannel
        || value.version !== desktopLifecycleVersion
        || typeof value.requestId !== 'string'
        || !desktopLifecycleRequestId.test(value.requestId)) return false
      if (value.type === 'check-update-request') return 'check-update'
      if (value.type === 'restart-request') return 'restart'
      return false
    }

    function isNetworkProxySettings(value) {
      if (value === null || typeof value !== 'object' || Array.isArray(value)) return false
      const keys = Object.keys(value).sort()
      return keys.join(',') === 'caCertificatePath,httpProxy,httpsProxy,mode,noProxy'
        && ['direct', 'system', 'custom'].includes(value.mode)
        && typeof value.httpProxy === 'string'
        && value.httpProxy.length <= 2048
        && typeof value.httpsProxy === 'string'
        && value.httpsProxy.length <= 2048
        && typeof value.noProxy === 'string'
        && value.noProxy.length <= 4096
        && typeof value.caCertificatePath === 'string'
        && value.caCertificatePath.length <= 4096
    }

    function readNetworkProxyAction(value) {
      if (value === null || typeof value !== 'object' || Array.isArray(value)) return false
      if (value.channel !== networkProxyChannel
        || value.version !== networkProxyVersion
        || typeof value.requestId !== 'string'
        || !desktopLifecycleRequestId.test(value.requestId)) return false
      if (value.type === 'get-request' || value.type === 'select-ca-request') {
        return Object.keys(value).sort().join(',') === 'channel,requestId,type,version'
          ? value.type === 'get-request' ? 'get' : 'select-ca'
          : false
      }
      if (value.type !== 'test-request' && value.type !== 'save-request') return false
      if (Object.keys(value).sort().join(',') !== 'channel,requestId,settings,type,version'
        || !isNetworkProxySettings(value.settings)) return false
      return value.type === 'test-request' ? 'test' : 'save'
    }

    function isMarketplaceExternalUrl(value) {
      if (typeof value !== 'string') return false
      let url
      try {
        url = new URL(value)
      }
      catch {
        return false
      }
      if (url.protocol !== 'https:' || url.username !== '' || url.password !== '' || url.port !== '' || url.hash !== '') return false
      const segments = url.pathname.split('/').filter(Boolean)
      const validSegment = segment => /^[A-Za-z0-9_.-]+$/.test(segment)
      if (url.hostname === 'github.com') {
        return url.search === '' && segments.length === 2 && segments.every(validSegment)
      }
      if (url.hostname !== 'www.npmjs.com') return false
      if (segments.length === 1 && segments[0] === 'search') {
        const keys = Array.from(url.searchParams.keys())
        return keys.length === 1 && keys[0] === 'q' && url.searchParams.get('q') !== ''
      }
      if (url.search !== '' || segments[0] !== 'package') return false
      if (segments.length === 2) return validSegment(segments[1])
      return segments.length === 3 && /^@[A-Za-z0-9_.-]+$/.test(segments[1]) && validSegment(segments[2])
    }

    function isExternalHttpUrl(value) {
      if (typeof value !== 'string' || value.length === 0 || value.length > 4096) return false
      let url
      try {
        url = new URL(value)
      }
      catch {
        return false
      }
      return ['http:', 'https:'].includes(url.protocol)
        && url.hostname !== ''
        && url.username === ''
        && url.password === ''
        && url.href.length <= 4096
    }

    function isExternalLinkRequest(value) {
      if (value === null || typeof value !== 'object' || Array.isArray(value)) return false
      const keys = Object.keys(value).sort()
      if (keys.join(',') !== 'channel,requestId,type,url,version') return false
      return value.channel === externalLinkChannel
        && value.version === externalLinkVersion
        && value.type === 'open-request'
        && typeof value.requestId === 'string'
        && desktopLifecycleRequestId.test(value.requestId)
        && isExternalHttpUrl(value.url)
    }

    function isMarketplaceLinkRequest(value) {
      if (value === null || typeof value !== 'object' || Array.isArray(value)) return false
      const keys = Object.keys(value).sort()
      if (keys.join(',') !== 'channel,requestId,type,url,version') return false
      return value.channel === marketplaceLinkChannel
        && value.version === marketplaceLinkVersion
        && value.type === 'open-request'
        && typeof value.requestId === 'string'
        && desktopLifecycleRequestId.test(value.requestId)
        && isMarketplaceExternalUrl(value.url)
    }

    window.addEventListener('message', async (event) => {
      const embeddedWindow = appFrame.contentWindow
      if (embeddedOrigin === undefined || embeddedWindow === null) return
      if (event.source !== embeddedWindow || event.origin !== embeddedOrigin) return
      if (isExternalLinkRequest(event.data)) {
        const response = {
          channel: externalLinkChannel,
          version: externalLinkVersion,
          type: 'open-response',
          requestId: event.data.requestId,
        }
        try {
          const invoke = window.__TAURI__?.core?.invoke
          if (typeof invoke !== 'function') throw new Error('Desktop external-link bridge is unavailable')
          await invoke('open_external_url', { url: event.data.url })
          response.ok = true
        }
        catch (error) {
          response.ok = false
          response.error = String(error instanceof Error ? error.message : error).slice(0, 2048)
        }
        embeddedWindow.postMessage(response, embeddedOrigin)
        return
      }
      if (isMarketplaceLinkRequest(event.data)) {
        const response = {
          channel: marketplaceLinkChannel,
          version: marketplaceLinkVersion,
          type: 'open-response',
          requestId: event.data.requestId,
        }
        try {
          const invoke = window.__TAURI__?.core?.invoke
          if (typeof invoke !== 'function') throw new Error('Desktop external-link bridge is unavailable')
          await invoke('open_marketplace_url', { url: event.data.url })
          response.ok = true
        }
        catch (error) {
          response.ok = false
          response.error = String(error instanceof Error ? error.message : error).slice(0, 2048)
        }
        embeddedWindow.postMessage(response, embeddedOrigin)
        return
      }
      const networkProxyAction = readNetworkProxyAction(event.data)
      if (networkProxyAction !== false) {
        const response = {
          channel: networkProxyChannel,
          version: networkProxyVersion,
          requestId: event.data.requestId,
        }
        embeddedWindow.postMessage({ ...response, type: `${networkProxyAction}-accepted` }, embeddedOrigin)
        try {
          const invoke = window.__TAURI__?.core?.invoke
          if (typeof invoke !== 'function') throw new Error('Desktop network proxy bridge is unavailable')
          if (networkProxyAction === 'get') {
            response.value = await invoke('get_network_proxy_settings')
          }
          else if (networkProxyAction === 'select-ca') {
            response.value = await invoke('select_ca_certificate')
          }
          else if (networkProxyAction === 'test') {
            response.value = await invoke('test_network_proxy_settings', { settings: event.data.settings })
          }
          else {
            response.value = await invoke('save_network_proxy_settings', { settings: event.data.settings })
          }
          response.type = `${networkProxyAction}-response`
          response.ok = true
        }
        catch (error) {
          response.type = `${networkProxyAction}-response`
          response.ok = false
          response.error = String(error instanceof Error ? error.message : error).slice(0, 2048)
        }
        embeddedWindow.postMessage(response, embeddedOrigin)
        return
      }
      const lifecycleAction = readDesktopLifecycleAction(event.data)
      if (lifecycleAction === false) return

      const response = {
        channel: desktopLifecycleChannel,
        version: desktopLifecycleVersion,
        requestId: event.data.requestId,
      }
      embeddedWindow.postMessage({ ...response, type: `${lifecycleAction}-accepted` }, embeddedOrigin)
      try {
        const invoke = window.__TAURI__?.core?.invoke
        if (typeof invoke !== 'function') throw new Error('Desktop lifecycle bridge is unavailable')
        if (lifecycleAction === 'check-update') {
          response.message = await invoke('check_for_updates')
        }
        else {
          await invoke('restart_app')
          throw new Error('Desktop restart returned without relaunching')
        }
        response.type = `${lifecycleAction}-response`
        response.ok = true
      }
      catch (error) {
        response.type = `${lifecycleAction}-response`
        response.ok = false
        response.error = String(error instanceof Error ? error.message : error).slice(0, 2048)
      }
      embeddedWindow.postMessage(response, embeddedOrigin)
    })

    async function boot() {
      const url = window.__DSH_WEB_LAUNCH_URL__
      window.__DSH_WEB_LAUNCH_URL__ = undefined
      if (url) appFrame.src = url
      renderWindowControls(window.__DSH_CHROME__ || {
        os: 'windows',
        left: [],
        right: ['minimize', 'maximize', 'close'],
      })
    }

    boot()
  </script>
</body>
</html>
