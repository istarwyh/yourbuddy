name: Issue lifecycle

on:
  issues:
    types:
      - opened
      - edited
      - labeled
      - unlabeled
      - closed
      - reopened
      - typed
      - untyped
      - field_added
      - field_removed
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - review_requested
  pull_request_review:
    types:
      - submitted

permissions:
  contents: read

concurrency:
  group: issue-lifecycle-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  lifecycle:
    name: Issue lifecycle
    # Event filters avoid allocating a runner for no-op reviews and edits. The
    # trusted configuration keeps optional Project writes disabled by default.
    if: >-
      (github.event_name != 'pull_request_review' || github.event.review.state == 'changes_requested') &&
      (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.body != null)
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Read Project configuration
        id: project
        run: node --input-type=module -e "import fs from 'node:fs'; const config = JSON.parse(fs.readFileSync('.github/issue-management/config.json', 'utf8')); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'enabled=' + (config.projectEnabled === true) + '\n')"
      - name: Handle repository event
        if: steps.project.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.ISSUE_PROJECT_TOKEN }}
        run: node .github/issue-management/policy.mjs lifecycle
