name: Bootstrap regression

on:
  pull_request:
    paths:
      - 'apps/desktop-tauri/src-tauri/**'
      - 'apps/desktop-tauri/product/personal-workbench/**'
      - 'apps/desktop-tauri/product/harness-pnpm-lock.yaml'
      - 'apps/desktop-tauri/product/claude-design-adapter/**'
      - 'apps/desktop-tauri/product/patches/dsh-claude-*-yourbuddy.patch'
      - 'apps/desktop-tauri/package.json'
      - 'apps/desktop-tauri/scripts/bundle-harness-source.mjs'
      - 'apps/desktop-tauri/scripts/test-bundled-design*.mjs'
      - 'apps/desktop-tauri/scripts/verify-design-runtime.mjs'
      - 'apps/desktop-tauri/scripts/design-client-evidence.mjs'
      - 'apps/desktop-tauri/scripts/prepare-harness-offline-store*.mjs'
      - 'apps/desktop-tauri/scripts/verify-product-release*.mjs'
      - 'apps/desktop-tauri/scripts/workbench-branding-smoke*.mjs'
      - 'apps/desktop-tauri/scripts/workbench-navigation.test.mjs'
      - 'apps/cli/package.json'
      - 'packages/util/http-proxy/**'
      - 'packages/client/ui-settings/**'
      - 'packages/client/ui-settings-general/**'
      - 'packages/client/ui-settings-models/**'
      - 'packages/client/ui-settings-account/**'
      - 'apps/desktop-tauri/scripts/node-extra-ca.test.mjs'
      - 'apps/desktop-tauri/splash.html'
      - 'apps/desktop-tauri/splash-state.js'
      - 'apps/desktop-tauri/desktop-i18n.js'
      - 'apps/desktop-tauri/scripts/splash-state.test.mjs'
      - 'apps/desktop-tauri/scripts/inspect-component-storage*.mjs'
      - 'apps/desktop-tauri/scripts/build-bootstrap-components*.mjs'
      - 'apps/desktop-tauri/scripts/tests/expected/component-storage.json'
      - 'apps/desktop-tauri/scripts/smoke-bootstrap-macos.mjs'
      - 'apps/desktop-tauri/scripts/verify-old-component-channel.mjs'
      - 'apps/desktop-tauri/scripts/verify-old-component-channel.test.mjs'
      - 'packages/sandbox/sandbox-windows-acl/tests/diagnose-script.spec.ts'
      - 'packages/sandbox/sandbox-windows-acl/tests/runner.spec.ts'
      - 'apps/desktop-tauri/scripts/prepare-bootstrap-shell.mjs'
      - 'apps/desktop-tauri/scripts/prepare-dist.mjs'
      - '.github/workflows/bootstrap-regression.yml'

permissions:
  contents: read

concurrency:
  group: bootstrap-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepared-release:
    name: Prepared macOS product
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v4.4.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-prepared
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.5'
      - name: Install locked tools and test the release verifier
        run: |
          pnpm install --frozen-lockfile
          node --test apps/desktop-tauri/scripts/verify-product-release.test.mjs apps/desktop-tauri/scripts/product-plugin-compatibility.test.mjs apps/desktop-tauri/scripts/workbench-branding-smoke.test.mjs
          pnpm exec vitest run packages/client/ui-settings-general/tests/settings-root.client.spec.tsx packages/client/ui-settings-models/tests/onboarding-dialog.client.spec.tsx packages/client/ui-settings-models/tests/welcome-notice.client.spec.tsx packages/client/ui-settings-account/tests/onboarding.client.spec.tsx
      - name: Build and prepare the frozen product
        env:
          DSH_CLIENT_TITLE: YourBuddy
          YOURBUDDY_OFFLINE_STORE_CACHE_DIR: ${{ runner.temp }}/yourbuddy-offline-store-cache
        run: |
          pnpm run build
          pnpm --dir apps/desktop-tauri run prepare:dist
          pnpm --dir apps/desktop-tauri exec playwright install chromium
          node --test apps/desktop-tauri/scripts/workbench-navigation.test.mjs
      - name: Require every materialized registry package and native optional input
        run: |
          tar -xzf apps/desktop-tauri/bundled/harness/yourbuddy-pnpm-store.tar.gz -C apps/desktop-tauri/bundled/harness
          pnpm --dir apps/desktop-tauri/bundled/harness --pm-on-fail=ignore install --prod --frozen-lockfile --offline --trust-lockfile --store-dir .yourbuddy-pnpm-store
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { createHash } from 'node:crypto'
          import { execFileSync } from 'node:child_process'
          import { accessSync, constants, existsSync, mkdirSync, readFileSync, readdirSync, statSync, writeFileSync } from 'node:fs'
          import { join, resolve } from 'node:path'
          import { load } from 'js-yaml'
          import { removeWorkspaceInstallState } from './apps/desktop-tauri/scripts/prepare-harness-offline-store.mjs'
          const root = resolve('apps/desktop-tauri/bundled/harness')
          const sourceLock = readFileSync('apps/desktop-tauri/product/harness-pnpm-lock.yaml')
          assert.ok(sourceLock.equals(readFileSync(join(root, 'pnpm-lock.yaml'))), 'prepared lock differs from the committed product lock')
          const locked = load(sourceLock.toString()).packages
          const store = join(root, 'node_modules/.pnpm')
          const entries = readdirSync(store, { withFileTypes: true }).filter(entry => entry.isDirectory() && entry.name !== 'node_modules')
          const installed = [], missing = []
          for (const entry of entries) {
            const separator = entry.name.indexOf('@', entry.name.startsWith('@') ? 1 : 0)
            const name = entry.name.slice(0, separator).replace('+', '/')
            const directory = join(store, entry.name, 'node_modules', name)
            const path = join(directory, 'package.json')
            if (!existsSync(path)) { missing.push(entry.name); continue }
            const manifest = JSON.parse(readFileSync(path, 'utf8'))
            assert.equal(manifest.name, name)
            assert.ok(locked[`${manifest.name}@${manifest.version}`], `installed package is not in the frozen lock: ${manifest.name}@${manifest.version}`)
            installed.push({ name, version: manifest.version, directory })
          }
          const required = [
            { name: '@openai/codex', versionSuffix: '-darwin-arm64', binary: 'vendor/aarch64-apple-darwin/bin/codex' },
            { name: '@anthropic-ai/claude-agent-sdk-darwin-arm64', versionSuffix: '', binary: 'claude' },
          ]
          const nativeInputs = required.map(input => {
            const matches = installed.filter(pkg => pkg.name === input.name && pkg.version.endsWith(input.versionSuffix))
            assert.equal(matches.length, 1, `missing or ambiguous native input: ${input.name}`)
            const path = join(matches[0].directory, input.binary)
            accessSync(path, constants.X_OK)
            const bytes = statSync(path).size
            assert.ok(bytes > 0, `empty native input: ${input.name}`)
            return { name: input.name, version: matches[0].version, binary: input.binary, bytes }
          })
          const evidence = join(process.env.RUNNER_TEMP, 'yourbuddy-prepared-acceptance')
          mkdirSync(evidence, { recursive: true })
          const result = { status: missing.length === 0 && installed.length === 570 ? 'passed' : 'failed', date: new Date().toISOString(), sourceCommit: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), lockSha256: createHash('sha256').update(sourceLock).digest('hex'), expectedRegistryPackages: 570, materializedRegistryPackages: entries.length, installedRegistryPackages: installed.length, missing, nativeInputs }
          writeFileSync(join(evidence, 'installed-registry-inputs.json'), `${JSON.stringify(result, null, 2)}\n`)
          assert.deepEqual(missing, [], 'optional registry package installation was skipped')
          // The current frozen product lock requires 570 darwin-arm64 registry packages.
          assert.equal(installed.length, 570, 'frozen macOS registry package inventory is incomplete')
          console.log(`Prepared registry inputs: ${installed.length}/${entries.length}; native Codex and Claude SDK executables exist`)
          removeWorkspaceInstallState(root)
          NODE
      - name: Run the unchanged release prepared acceptance step
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { spawnSync } from 'node:child_process'
          import { load } from 'js-yaml'
          const workflow = load(readFileSync('.github/workflows/desktop-release.yml', 'utf8'))
          const step = workflow.jobs.build.steps.find(step => step.name === 'Verify prepared default workbench and optional Harbor')
          const version = JSON.parse(readFileSync('apps/desktop-tauri/package.json', 'utf8')).version
          const result = spawnSync('bash', ['-e', '-o', 'pipefail', '-c', step.run], {
            stdio: 'inherit', env: { ...process.env, RELEASE_TAG: `yourbuddy-v${version}` },
          })
          if (result.error) throw result.error
          process.exitCode = result.status ?? 1
          NODE
      - name: Retain prepared product acceptance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: yourbuddy-pr-prepared-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/yourbuddy-prepared-acceptance/
          if-no-files-found: warn
          retention-days: 7

  bootstrap:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test splash state and recovery controls
        run: node --test apps/desktop-tauri/scripts/splash-state.test.mjs apps/desktop-tauri/scripts/verify-old-component-channel.test.mjs
      - name: Test read-only component storage inventory
        run: node --test apps/desktop-tauri/scripts/inspect-component-storage.test.mjs
      - name: Compile the desktop application and test Bootstrap recovery
        working-directory: apps/desktop-tauri/src-tauri
        run: |
          cargo test --locked runtime::component_plan
          cargo test --locked runtime::component_leases
          cargo test --locked runtime::components
          cargo test --locked runtime::boot_status::tests
          cargo test --locked runtime::provision
          cargo test --locked runtime::supervisor::tests
          cargo test --locked updater::
          cargo test --locked network_proxy::
          cargo test --locked desktop_shell::tests::tauri_framework_exposes_one_stable_first_party_gateway_to_the_desktop_shell

  network-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-proxy
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install locked build tools
        run: pnpm install --frozen-lockfile
      - name: Build the managed Harness and native helper
        env:
          DSH_CLIENT_TITLE: YourBuddy
        run: pnpm run build
      - name: Check Workbench proxy diagnostics and save/restart controls
        run: |
          pnpm --dir apps/desktop-tauri/product/personal-workbench run typecheck
          pnpm --dir apps/desktop-tauri/product/personal-workbench run test --maxWorkers=2
      # Reuse the YourBuddy build above; the generic CI consumer lane builds the
      # official DSH identity, which the product assembler correctly rejects.
      - name: Install Chromium for bundled design acceptance
        run: pnpm --dir apps/desktop-tauri exec playwright install --with-deps chromium
      - name: Assemble and install the pinned design product graph
        run: |
          node apps/desktop-tauri/scripts/bundle-harness-source.mjs
          pnpm --dir apps/desktop-tauri run prepare:offline-store
          tar -xzf apps/desktop-tauri/bundled/harness/yourbuddy-pnpm-store.tar.gz -C apps/desktop-tauri/bundled/harness
          pnpm --dir apps/desktop-tauri/bundled/harness install --prod --frozen-lockfile --offline --trust-lockfile --store-dir .yourbuddy-pnpm-store
      - name: Test installed design Host and Chromium Client
        env:
          YOURBUDDY_DESIGN_EVIDENCE_DIR: ${{ runner.temp }}/yourbuddy-design-evidence
        run: |
          set -o pipefail
          node apps/desktop-tauri/scripts/test-bundled-design.mjs 2>&1 | tee "$RUNNER_TEMP/yourbuddy-design-acceptance.log"
      - name: Retain design acceptance log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: yourbuddy-design-acceptance
          path: |
            ${{ runner.temp }}/yourbuddy-design-acceptance.log
            ${{ runner.temp }}/yourbuddy-design-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
      - name: Test isolated production dependency layout and startup CA
        run: node --test apps/desktop-tauri/scripts/node-extra-ca.test.mjs

  packaged-splash:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Require existing runner Accessibility access
        run: node apps/desktop-tauri/scripts/smoke-bootstrap-macos.mjs --preflight
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-packaged
      - name: Install locked build tools
        run: pnpm install --frozen-lockfile
      - name: Test component archives with macOS BSD tar
        run: node --test apps/desktop-tauri/scripts/build-bootstrap-components.test.mjs
      - name: Prepare authentic old signed channel rejection fixture
        shell: bash
        run: |
          curl --fail --location --retry 2 https://github.com/istarwyh/yourbuddy/releases/download/yourbuddy-v0.4.8/yourbuddy-0.4.8-bootstrap-macos-arm64.app.tar.gz -o "$RUNNER_TEMP/bootstrap-resources.tar.gz"
          mkdir "$RUNNER_TEMP/bootstrap-resources"
          tar -xzf "$RUNNER_TEMP/bootstrap-resources.tar.gz" -C "$RUNNER_TEMP/bootstrap-resources"
          cp -R "$RUNNER_TEMP/bootstrap-resources/YourBuddy.app/Contents/Resources/component-channel/." apps/desktop-tauri/component-channel/
          mkdir -p apps/desktop-tauri/bundled/toolchain
          cp apps/desktop-tauri/component-channel/pnpm-11.7.0.tgz apps/desktop-tauri/bundled/toolchain/
      - name: Build current-source ad-hoc application without updater artifacts
        run: pnpm --dir apps/desktop-tauri exec tauri build --target aarch64-apple-darwin --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Exercise packaged native splash commands
        shell: bash
        run: |
          app=apps/desktop-tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/YourBuddy.app/Contents/MacOS/yourbuddy
          node apps/desktop-tauri/scripts/verify-old-component-channel.mjs "$app" "${app%/MacOS/yourbuddy}/Resources/component-channel/components.json"
          node apps/desktop-tauri/scripts/smoke-bootstrap-macos.mjs "$app" "$RUNNER_TEMP/bootstrap-smoke"
      - name: Retain synthetic packaged smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-bootstrap-smoke
          path: ${{ runner.temp }}/bootstrap-smoke
          if-no-files-found: ignore

  windows-acl-fixtures:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-acl
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install locked test dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify fixture DACLs and inherited-deny behavior
        shell: pwsh
        run: |
          Get-Command pwsh -ErrorAction Stop
          pnpm exec vitest run --project thread-safe packages/sandbox/sandbox-windows-acl/tests/diagnose-script.spec.ts packages/sandbox/sandbox-windows-acl/tests/runner.spec.ts
