name: YourBuddy macOS Release

on:
  push:
    tags:
      - yourbuddy-v*
  workflow_dispatch:
    inputs:
      mode:
        description: Retry an existing tag, validate a candidate, or first-publish verified 0.4.11
        type: choice
        options:
          - existing-tag
          - first-publication
          - candidate-validation
        default: existing-tag
        required: true
      version:
        description: Candidate validation or first publication (fixed at 0.4.11)
        default: '0.4.11'
        required: false
      verified_master_sha:
        description: Candidate validation or first publication, exact operator-verified master SHA
        required: false
      tag:
        description: Existing unpublished yourbuddy-v* tag to build after a failed run
        required: true
        default: desktop-v0.2.0-rc.1-0.3

permissions:
  contents: write

concurrency:
  group: yourbuddy-release-${{ github.event_name == 'workflow_dispatch' && (inputs.mode != 'existing-tag' && inputs.mode != '' && 'yourbuddy-v0.4.11' || inputs.tag) || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'existing-tag' }}
  RELEASE_VERSION: ${{ inputs.version }}
  VERIFIED_MASTER_SHA: ${{ inputs.verified_master_sha }}
  NODE_VERSION: '24'
  RUST_TARGET: aarch64-apple-darwin
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode != 'existing-tag' && inputs.mode != '' && 'yourbuddy-v0.4.11' || inputs.tag) || github.ref_name }}

jobs:
  build:
    name: Build macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_MODE != 'existing-tag' && 'master' || env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4.4.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate release route and refuse an existing Release
        if: env.RELEASE_MODE != 'existing-tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/desktop-tauri/scripts/first-publication.mjs preflight

      - name: Refuse an existing Release for tag retry
        if: env.RELEASE_MODE == 'existing-tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const { GITHUB_REPOSITORY: repo, RELEASE_TAG: tag, GH_TOKEN: token } = process.env
          try {
            if (!token) throw new Error('missing token')
            const response = await fetch(`https://api.github.com/repos/${repo}/releases/tags/${encodeURIComponent(tag)}`, {
              headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' },
              redirect: 'error', signal: AbortSignal.timeout(30_000),
            })
            if (response.status !== 404) throw new Error('Release exists or its absence is unverified')
          } catch {
            console.error('Release exists or its absence could not be established; refusing publication')
            process.exitCode = 1
          }
          NODE

      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/yourbuddy-offline-store-cache
          key: ${{ runner.os }}-${{ runner.arch }}-yourbuddy-pnpm-store-v1-${{ hashFiles('apps/desktop-tauri/product/harness-pnpm-lock.yaml') }}

      - name: Verify release tag and desktop versions
        run: node apps/desktop-tauri/scripts/verify-release-version.mjs --tag "$RELEASE_TAG"

      - name: Check native acceptance prerequisites
        if: env.RELEASE_MODE != 'existing-tag' || (env.RELEASE_TAG == 'yourbuddy-v0.4.9' || env.RELEASE_TAG == 'yourbuddy-v0.4.10' || env.RELEASE_TAG == 'yourbuddy-v0.4.11')
        run: |
          git show "${GITHUB_WORKFLOW_SHA:?}:apps/desktop-tauri/scripts/smoke-offline-startup-macos.mjs" > "$RUNNER_TEMP/yourbuddy-native-smoke.mjs"
          echo "Native acceptance runner: $GITHUB_WORKFLOW_SHA; application source: $(git rev-parse HEAD)"
          node "$RUNNER_TEMP/yourbuddy-native-smoke.mjs" --preflight

      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.5'

      - name: Install Rust target
        run: rustup target add "$RUST_TARGET"

      - name: Identify Rust toolchain
        id: rust
        run: echo "cache-key=$(rustc -Vv | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/desktop-tauri/src-tauri/target/release/.fingerprint
            apps/desktop-tauri/src-tauri/target/release/build
            apps/desktop-tauri/src-tauri/target/release/deps
            apps/desktop-tauri/src-tauri/target/aarch64-apple-darwin/release/.fingerprint
            apps/desktop-tauri/src-tauri/target/aarch64-apple-darwin/release/build
            apps/desktop-tauri/src-tauri/target/aarch64-apple-darwin/release/deps
          key: ${{ runner.os }}-${{ runner.arch }}-yourbuddy-cargo-${{ steps.rust.outputs.cache-key }}-${{ hashFiles('apps/desktop-tauri/src-tauri/Cargo.lock', 'apps/desktop-tauri/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-yourbuddy-cargo-${{ steps.rust.outputs.cache-key }}-
            ${{ runner.os }}-${{ runner.arch }}-yourbuddy-cargo-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types before candidate validation or publication
        if: env.RELEASE_MODE != 'existing-tag'
        run: pnpm run typecheck

      - name: Verify the candidate without publishing
        if: env.RELEASE_MODE == 'candidate-validation'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/desktop-tauri/scripts/first-publication.mjs verify

      - name: Publish the verified master tag atomically
        if: env.RELEASE_MODE == 'first-publication'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/desktop-tauri/scripts/first-publication.mjs publish

      - name: Build Harness
        env:
          DSH_CLIENT_TITLE: YourBuddy
        run: pnpm run build

      - name: Verify component preparation and release pipeline
        env:
          YOURBUDDY_BUILT_HARNESS_ROOT: ${{ github.workspace }}
        run: |
          TMPDIR="$(node -p 'require("node:fs").realpathSync(require("node:os").tmpdir())')"
          export TMPDIR
          YOURBUDDY_CAPABILITY_TEST_STORE="$(pnpm store path)" \
            pnpm --dir apps/desktop-tauri run test:components
          pnpm --dir apps/desktop-tauri run test:native-overlay

      - name: Prepare frozen release inputs
        env:
          YOURBUDDY_OFFLINE_STORE_CACHE_DIR: ${{ runner.temp }}/yourbuddy-offline-store-cache
        run: pnpm --dir apps/desktop-tauri run prepare:dist

      - name: Install prepared product acceptance browser
        if: env.RELEASE_MODE != 'existing-tag' || (env.RELEASE_TAG == 'yourbuddy-v0.4.9' || env.RELEASE_TAG == 'yourbuddy-v0.4.10' || env.RELEASE_TAG == 'yourbuddy-v0.4.11')
        run: pnpm --dir apps/desktop-tauri exec playwright install chromium

      - name: Verify prepared default workbench and optional Harbor
        if: env.RELEASE_MODE != 'existing-tag' || (env.RELEASE_TAG == 'yourbuddy-v0.4.9' || env.RELEASE_TAG == 'yourbuddy-v0.4.10' || env.RELEASE_TAG == 'yourbuddy-v0.4.11')
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { mkdirSync, realpathSync, rmSync, writeFileSync } from 'node:fs'
          import { tmpdir } from 'node:os'
          import { join, resolve } from 'node:path'
          import { pathToFileURL } from 'node:url'
          import { isolatedReleaseEnvironment, renderReleaseDesktopOverlay, withProcessEnvironment } from './apps/desktop-tauri/scripts/prepare-release.mjs'
          import { frozenOfflineInstallArgs, pinPnpmInvocationArgs } from './apps/desktop-tauri/scripts/prepare-harness-offline-store.mjs'
          import { readPreparedCapabilities } from './apps/desktop-tauri/scripts/prepare-capability-components.mjs'
          import { redactEvidence } from './apps/desktop-tauri/scripts/smoke-offline-startup-macos.mjs'

          const sourceEnvironment = { ...process.env }
          const desktopRoot = resolve('apps/desktop-tauri')
          const harnessRoot = join(desktopRoot, 'bundled/harness')
          const evidence = join(realpathSync(sourceEnvironment.RUNNER_TEMP), 'yourbuddy-prepared-acceptance')
          mkdirSync(evidence, { recursive: true })
          const result = {
            status: 'failed',
            date: new Date().toISOString(),
            releaseTag: sourceEnvironment.RELEASE_TAG,
            sourceCommit: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            workflowCommit: sourceEnvironment.GITHUB_WORKFLOW_SHA,
            platform: `${process.platform}-${process.arch}`,
            node: process.version,
            scope: 'Prepared real Host and Profile; 8 default Clients then 9 with Harbor; Chromium interaction. Desktop invoke stubs are bridge-only; native acceptance is separate.',
          }
          const isolated = isolatedReleaseEnvironment(sourceEnvironment, realpathSync(tmpdir()))
          const verifierPath = join(desktopRoot, 'scripts', `.yourbuddy-prepared-verifier-${process.pid}.mjs`)
          try {
            if (!sourceEnvironment.GITHUB_WORKFLOW_SHA) throw new Error('GITHUB_WORKFLOW_SHA is required for prepared acceptance')
            writeFileSync(verifierPath, execFileSync('git', [
              'show', `${sourceEnvironment.GITHUB_WORKFLOW_SHA}:apps/desktop-tauri/scripts/verify-product-release.mjs`,
            ]), { flag: 'wx' })
            const { verifyPreparedProduct } = await import(pathToFileURL(verifierPath).href)
            await withProcessEnvironment({
              ...isolated.env,
              CI: 'true',
              YOURBUDDY_RELEASE_EVIDENCE_DIR: evidence,
              YOURBUDDY_RELEASE_VIDEO_DIR: join(evidence, 'videos'),
              YOURBUDDY_RELEASE_SCREENSHOT: join(evidence, 'workbench-last-captured.png'),
            }, async () => {
              execFileSync('tar', ['-xzf', join(harnessRoot, 'yourbuddy-pnpm-store.tar.gz'), '-C', harnessRoot])
              execFileSync('pnpm', pinPnpmInvocationArgs(frozenOfflineInstallArgs()), { cwd: harnessRoot, stdio: 'inherit' })
              const projectRoot = join(isolated.root, 'desktop-project')
              mkdirSync(projectRoot)
              const desktopOverlayPath = renderReleaseDesktopOverlay({
                outputPath: join(isolated.root, 'desktop-overlay.yml'),
                projectRoot,
                productRuntimeRoot: join(desktopRoot, 'bundled/yourbuddy-runtime'),
              }, sourceEnvironment)
              await verifyPreparedProduct(harnessRoot, join(desktopRoot, 'bundled/yourbuddy-runtime'), {
                capabilities: readPreparedCapabilities(),
                desktopOverlayPath,
              })
              rmSync(join(harnessRoot, '.yourbuddy-pnpm-store'), { recursive: true })
            })
            isolated.discard()
            result.status = 'passed'
          } catch (error) {
            result.error = redactEvidence(error.stack ?? String(error))
            console.error(result.error)
            process.exitCode = 1
          } finally {
            rmSync(verifierPath, { force: true })
            writeFileSync(join(evidence, 'result.json'), `${JSON.stringify(result, null, 2)}\n`)
          }
          NODE

      - name: Remove Python bytecode excluded from component archives
        if: env.RELEASE_MODE != 'existing-tag' || (env.RELEASE_TAG == 'yourbuddy-v0.4.9' || env.RELEASE_TAG == 'yourbuddy-v0.4.10' || env.RELEASE_TAG == 'yourbuddy-v0.4.11')
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, rmSync } from 'node:fs'
          import { join } from 'node:path'
          const removeBytecode = root => {
            for (const entry of readdirSync(root, { withFileTypes: true })) {
              const path = join(root, entry.name)
              if ((entry.isDirectory() && entry.name === '__pycache__') || (entry.isFile() && entry.name.endsWith('.pyc'))) {
                rmSync(path, { recursive: true })
              } else if (entry.isDirectory()) {
                removeBytecode(path)
              }
            }
          }
          removeBytecode('apps/desktop-tauri/bundled/yourbuddy-runtime')
          NODE

      - name: Build immutable runtime components
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version="${RELEASE_TAG#yourbuddy-v}"
          pnpm --dir apps/desktop-tauri run build:components -- --version "$version"
          manifest="apps/desktop-tauri/component-release/yourbuddy-components-$version.json"
          pnpm --dir apps/desktop-tauri exec tauri signer sign "$PWD/$manifest"
          node apps/desktop-tauri/scripts/normalize-component-signature.mjs "$manifest.sig"
          cp "$manifest" apps/desktop-tauri/component-channel/components.json
          cp "$manifest.sig" apps/desktop-tauri/component-channel/components.json.sig

      - name: Retain component archive measurements
        if: env.RELEASE_MODE != 'existing-tag' || (env.RELEASE_TAG == 'yourbuddy-v0.4.9' || env.RELEASE_TAG == 'yourbuddy-v0.4.10' || env.RELEASE_TAG == 'yourbuddy-v0.4.11')
        run: |
          version="${RELEASE_TAG#yourbuddy-v}"
          cp "apps/desktop-tauri/component-release/yourbuddy-components-$version.json" "$RUNNER_TEMP/yourbuddy-prepared-acceptance/"
          cp "apps/desktop-tauri/component-release/yourbuddy-components-$version.json.sig" "$RUNNER_TEMP/yourbuddy-prepared-acceptance/"
          cp "apps/desktop-tauri/component-release/yourbuddy-size-report-$version.json" "$RUNNER_TEMP/yourbuddy-prepared-acceptance/"

      - name: Build Bootstrap app and DMG
        env:
          YOURBUDDY_OFFLINE_STORE_CACHE_DIR: ${{ runner.temp }}/yourbuddy-offline-store-cache
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm --dir apps/desktop-tauri run build:bootstrap
          "apps/desktop-tauri/src-tauri/target/$RUST_TARGET/release/yourbuddy" --yourbuddy-component-helper verify-channel
          mkdir -p "$RUNNER_TEMP/bootstrap-bundle"
          ditto "apps/desktop-tauri/src-tauri/target/$RUST_TARGET/release/bundle" "$RUNNER_TEMP/bootstrap-bundle"

      - name: Enforce Bootstrap DMG ceiling and resource exclusions
        run: |
          dmg="$(find "$RUNNER_TEMP/bootstrap-bundle" -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          node apps/desktop-tauri/scripts/build-bootstrap-components.mjs --assert-bootstrap-dmg "$dmg"
          updater="$(find "$RUNNER_TEMP/bootstrap-bundle" -type f -name '*.app.tar.gz' -print -quit)"
          test -n "$updater"
          resources="$RUNNER_TEMP/bootstrap-resources"
          mkdir -p "$resources"
          tar -xzf "$updater" -C "$resources"
          test ! -e "$resources/YourBuddy.app/Contents/Resources/harness-source"
          test ! -e "$resources/YourBuddy.app/Contents/Resources/toolchain"
          test ! -e "$resources/YourBuddy.app/Contents/Resources/yourbuddy-runtime"
          test ! -e "$resources/YourBuddy.app/Contents/Resources/component-seeds"
          test -f "$resources/YourBuddy.app/Contents/Resources/component-channel/components.json"
          test -f "$resources/YourBuddy.app/Contents/Resources/component-channel/pnpm-11.7.0.tgz"

      - name: Build Offline app and DMG
        env:
          YOURBUDDY_OFFLINE_STORE_CACHE_DIR: ${{ runner.temp }}/yourbuddy-offline-store-cache
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          find apps/desktop-tauri/component-seeds -mindepth 1 -maxdepth 1 -delete
          cp apps/desktop-tauri/component-release/*.tar.zst apps/desktop-tauri/component-seeds/
          pnpm --dir apps/desktop-tauri run build:offline
          updater="$(find "apps/desktop-tauri/src-tauri/target/$RUST_TARGET/release/bundle" -type f -name '*.app.tar.gz' -print -quit)"
          test -n "$updater"
          resources="$RUNNER_TEMP/offline-updater-resources"
          mkdir -p "$resources"
          tar -xzf "$updater" -C "$resources"
          test -f "$resources/YourBuddy.app/Contents/Resources/component-channel/components.json"
          for seed in apps/desktop-tauri/component-release/*.tar.zst; do
            test -f "$resources/YourBuddy.app/Contents/Resources/component-seeds/$(basename "$seed")"
          done

      - name: Record installer archive sizes
        if: env.RELEASE_MODE != 'existing-tag' || (env.RELEASE_TAG == 'yourbuddy-v0.4.9' || env.RELEASE_TAG == 'yourbuddy-v0.4.10' || env.RELEASE_TAG == 'yourbuddy-v0.4.11')
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, statSync, writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          const measure = root => readdirSync(root, { recursive: true, withFileTypes: true })
            .filter(entry => entry.isFile() && /\.(?:dmg|app\.tar\.gz)(?:\.sig)?$/.test(entry.name))
            .map(entry => ({ name: entry.name, bytes: statSync(join(entry.parentPath, entry.name)).size }))
            .sort((left, right) => left.name.localeCompare(right.name))
          const result = {
            releaseTag: process.env.RELEASE_TAG,
            scope: 'Installer and updater archive bytes; not measured network traffic or installed size.',
            bootstrap: measure(join(process.env.RUNNER_TEMP, 'bootstrap-bundle')),
            offline: measure(`apps/desktop-tauri/src-tauri/target/${process.env.RUST_TARGET}/release/bundle`),
          }
          writeFileSync(join(process.env.RUNNER_TEMP, 'yourbuddy-prepared-acceptance/installer-sizes.json'), `${JSON.stringify(result, null, 2)}\n`)
          NODE

      - name: Verify native Offline installation and cold starts
        if: env.RELEASE_MODE != 'existing-tag' || (env.RELEASE_TAG == 'yourbuddy-v0.4.9' || env.RELEASE_TAG == 'yourbuddy-v0.4.10' || env.RELEASE_TAG == 'yourbuddy-v0.4.11')
        run: node "$RUNNER_TEMP/yourbuddy-native-smoke.mjs" "$RUNNER_TEMP/offline-updater-resources/YourBuddy.app/Contents/MacOS/yourbuddy" "$RUNNER_TEMP/offline-startup-smoke" "${RELEASE_TAG#yourbuddy-v}"

      - name: Test relocated YourBuddy product runtime
        run: |
          harbor="$(find apps/desktop-tauri/component-release -type f -name 'yourbuddy-harbor-*.tar.zst' -print -quit)"
          test -n "$harbor"
          extracted="$RUNNER_TEMP/yourbuddy-harbor"
          mkdir -p "$extracted"
          tar -xaf "$harbor" -C "$extracted"
          bundled="$extracted"
          relocated="$RUNNER_TEMP/yourbuddy-runtime-relocated"
          ditto "$bundled" "$relocated"
          cp -L "$relocated/venv/bin/python" "$RUNNER_TEMP/yourbuddy-python-bundle-copy"
          rm "$relocated/venv/bin/python"
          mv "$RUNNER_TEMP/yourbuddy-python-bundle-copy" "$relocated/venv/bin/python"
          test ! -L "$relocated/venv/bin/python"
          sed -i '' 's|^home = .*|home = /private/nonexistent/yourbuddy-python/bin|' "$relocated/venv/pyvenv.cfg"
          env -u PYTHONHOME "$relocated/venv/bin/harbor" --version
          env -u PYTHONHOME "$relocated/venv/bin/harbor-dsh" --help >/dev/null

      - name: Stage release assets
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop-tauri/package.json | ConvertFrom-Json).version
          $bootstrapRoot = "$env:RUNNER_TEMP/bootstrap-bundle"
          $offlineRoot = "apps/desktop-tauri/src-tauri/target/$env:RUST_TARGET/release/bundle"
          New-Item -ItemType Directory -Force release-assets | Out-Null

          $bootstrapDmg = Get-ChildItem $bootstrapRoot -Recurse -File -Filter '*.dmg' | Select-Object -First 1
          $bootstrapUpdater = Get-ChildItem $bootstrapRoot -Recurse -File -Filter '*.app.tar.gz' | Select-Object -First 1
          $offlineDmg = Get-ChildItem $offlineRoot -Recurse -File -Filter '*.dmg' | Select-Object -First 1
          $offlineUpdater = Get-ChildItem $offlineRoot -Recurse -File -Filter '*.app.tar.gz' | Select-Object -First 1
          if (-not $bootstrapDmg -or -not $bootstrapUpdater -or -not $offlineDmg -or -not $offlineUpdater) { throw "Bootstrap, Offline, or updater artifact is missing" }
          $bootstrapSignature = Get-Item "$($bootstrapUpdater.FullName).sig" -ErrorAction Stop
          $offlineSignature = Get-Item "$($offlineUpdater.FullName).sig" -ErrorAction Stop

          Copy-Item $bootstrapDmg.FullName "release-assets/yourbuddy-$version-bootstrap-macos-arm64.dmg"
          Copy-Item $offlineDmg.FullName "release-assets/yourbuddy-$version-offline-macos-arm64.dmg"
          $bootstrapUpdaterDestination = "release-assets/yourbuddy-$version-bootstrap-macos-arm64.app.tar.gz"
          Copy-Item $bootstrapUpdater.FullName $bootstrapUpdaterDestination
          Copy-Item $bootstrapSignature.FullName "$bootstrapUpdaterDestination.sig"
          $offlineUpdaterDestination = "release-assets/yourbuddy-$version-offline-macos-arm64.app.tar.gz"
          Copy-Item $offlineUpdater.FullName $offlineUpdaterDestination
          Copy-Item $offlineSignature.FullName "$offlineUpdaterDestination.sig"
          Copy-Item apps/desktop-tauri/component-release/*.tar.zst release-assets/
          Copy-Item "apps/desktop-tauri/component-release/yourbuddy-components-$version.json" release-assets/
          Copy-Item "apps/desktop-tauri/component-release/yourbuddy-components-$version.json.sig" release-assets/
          Copy-Item "apps/desktop-tauri/component-release/yourbuddy-size-report-$version.json" release-assets/

      - name: Generate updater manifest
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop-tauri/package.json | ConvertFrom-Json).version
          $publishedAt = (Get-Date).ToUniversalTime().ToString('o')
          node apps/desktop-tauri/scripts/generate-updater-manifest.mjs `
            --assets-dir release-assets `
            --output release-assets/latest.json `
            --version $version `
            --repository $env:GITHUB_REPOSITORY `
            --release-tag $env:RELEASE_TAG `
            --notes-file apps/desktop-tauri/release-notes.md `
            --pub-date $publishedAt

      - name: Generate and verify release checksums
        shell: pwsh
        run: |
          Get-ChildItem release-assets -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -NoNewline:$false release-assets/SHA256SUMS.txt
          Push-Location release-assets
          shasum -a 256 --check SHA256SUMS.txt
          Pop-Location

      - name: Retain updater metadata and checksums
        if: env.RELEASE_MODE != 'existing-tag' || (env.RELEASE_TAG == 'yourbuddy-v0.4.9' || env.RELEASE_TAG == 'yourbuddy-v0.4.10' || env.RELEASE_TAG == 'yourbuddy-v0.4.11')
        run: cp release-assets/latest.json release-assets/SHA256SUMS.txt "$RUNNER_TEMP/yourbuddy-prepared-acceptance/"

      - name: Publish release
        if: env.RELEASE_MODE != 'candidate-validation'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "YourBuddy ${RELEASE_TAG#yourbuddy-v}" --notes-file apps/desktop-tauri/release-notes.md --latest

          if gh release view yourbuddy-updater >/dev/null 2>&1; then
            gh release upload yourbuddy-updater release-assets/latest.json --clobber
          else
            gh release create yourbuddy-updater release-assets/latest.json --target "$(git rev-parse HEAD)" --title "YourBuddy update channel" --notes "Signed macOS arm64 update manifest." --prerelease
          fi

      - name: Upload validation candidate artifacts
        if: env.RELEASE_MODE == 'candidate-validation'
        uses: actions/upload-artifact@v4
        with:
          name: yourbuddy-candidate-0.4.11-${{ inputs.verified_master_sha }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

      - name: Upload prepared acceptance evidence
        if: always() && (env.RELEASE_MODE != 'existing-tag' || (env.RELEASE_TAG == 'yourbuddy-v0.4.9' || env.RELEASE_TAG == 'yourbuddy-v0.4.10' || env.RELEASE_TAG == 'yourbuddy-v0.4.11'))
        uses: actions/upload-artifact@v4
        with:
          name: yourbuddy-prepared-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/yourbuddy-prepared-acceptance/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload native acceptance evidence
        if: always() && (env.RELEASE_MODE != 'existing-tag' || (env.RELEASE_TAG == 'yourbuddy-v0.4.9' || env.RELEASE_TAG == 'yourbuddy-v0.4.10' || env.RELEASE_TAG == 'yourbuddy-v0.4.11'))
        uses: actions/upload-artifact@v4
        with:
          name: yourbuddy-native-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/offline-startup-smoke/evidence/
          if-no-files-found: warn
          retention-days: 7
