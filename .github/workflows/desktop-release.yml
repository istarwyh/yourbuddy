name: YourBuddy macOS Release

on:
  push:
    tags:
      - yourbuddy-v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing unpublished yourbuddy-v* tag to build after a failed run
        required: true
        default: yourbuddy-v0.4.0

permissions:
  contents: write

concurrency:
  group: yourbuddy-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  RUST_TARGET: aarch64-apple-darwin
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse to replace a published version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; publish a new version instead of replacing its assets." >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v4.4.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/yourbuddy-offline-store-cache
          key: ${{ runner.os }}-${{ runner.arch }}-yourbuddy-pnpm-store-v1-${{ hashFiles('apps/desktop-tauri/product/harness-pnpm-lock.yaml') }}

      - name: Verify release tag and desktop versions
        run: node apps/desktop-tauri/scripts/verify-release-version.mjs --tag "$RELEASE_TAG"

      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.5'

      - name: Install Rust target
        run: rustup target add "$RUST_TARGET"

      - name: Identify Rust toolchain
        id: rust
        run: echo "cache-key=$(rustc -Vv | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/desktop-tauri/src-tauri/target/release/.fingerprint
            apps/desktop-tauri/src-tauri/target/release/build
            apps/desktop-tauri/src-tauri/target/release/deps
            apps/desktop-tauri/src-tauri/target/aarch64-apple-darwin/release/.fingerprint
            apps/desktop-tauri/src-tauri/target/aarch64-apple-darwin/release/build
            apps/desktop-tauri/src-tauri/target/aarch64-apple-darwin/release/deps
          key: ${{ runner.os }}-${{ runner.arch }}-yourbuddy-cargo-${{ steps.rust.outputs.cache-key }}-${{ hashFiles('apps/desktop-tauri/src-tauri/Cargo.lock', 'apps/desktop-tauri/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-yourbuddy-cargo-${{ steps.rust.outputs.cache-key }}-
            ${{ runner.os }}-${{ runner.arch }}-yourbuddy-cargo-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Harness
        env:
          DSH_CLIENT_TITLE: YourBuddy
        run: pnpm run build

      - name: Build immutable runtime components
        env:
          YOURBUDDY_OFFLINE_STORE_CACHE_DIR: ${{ runner.temp }}/yourbuddy-offline-store-cache
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version="${RELEASE_TAG#yourbuddy-v}"
          pnpm --dir apps/desktop-tauri run prepare:dist
          pnpm --dir apps/desktop-tauri run build:components -- --version "$version"
          manifest="apps/desktop-tauri/component-release/yourbuddy-components-$version.json"
          pnpm --dir apps/desktop-tauri exec tauri signer sign "$PWD/$manifest"
          node apps/desktop-tauri/scripts/normalize-component-signature.mjs "$manifest.sig"
          cp "$manifest" apps/desktop-tauri/component-channel/components.json
          cp "$manifest.sig" apps/desktop-tauri/component-channel/components.json.sig

      - name: Build Bootstrap app and DMG
        env:
          YOURBUDDY_OFFLINE_STORE_CACHE_DIR: ${{ runner.temp }}/yourbuddy-offline-store-cache
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm --dir apps/desktop-tauri run build:bootstrap
          "apps/desktop-tauri/src-tauri/target/$RUST_TARGET/release/yourbuddy" --yourbuddy-component-helper verify-channel
          mkdir -p "$RUNNER_TEMP/bootstrap-bundle"
          ditto "apps/desktop-tauri/src-tauri/target/$RUST_TARGET/release/bundle" "$RUNNER_TEMP/bootstrap-bundle"

      - name: Enforce Bootstrap DMG ceiling and resource exclusions
        run: |
          dmg="$(find "$RUNNER_TEMP/bootstrap-bundle" -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          node apps/desktop-tauri/scripts/build-bootstrap-components.mjs --assert-bootstrap-dmg "$dmg"
          updater="$(find "$RUNNER_TEMP/bootstrap-bundle" -type f -name '*.app.tar.gz' -print -quit)"
          test -n "$updater"
          resources="$RUNNER_TEMP/bootstrap-resources"
          mkdir -p "$resources"
          tar -xzf "$updater" -C "$resources"
          test ! -e "$resources/YourBuddy.app/Contents/Resources/harness-source"
          test ! -e "$resources/YourBuddy.app/Contents/Resources/toolchain"
          test ! -e "$resources/YourBuddy.app/Contents/Resources/yourbuddy-runtime"
          test ! -e "$resources/YourBuddy.app/Contents/Resources/component-seeds"
          test -f "$resources/YourBuddy.app/Contents/Resources/component-channel/components.json"
          test -f "$resources/YourBuddy.app/Contents/Resources/component-channel/pnpm-11.7.0.tgz"

      - name: Build Offline app and DMG
        env:
          YOURBUDDY_OFFLINE_STORE_CACHE_DIR: ${{ runner.temp }}/yourbuddy-offline-store-cache
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          find apps/desktop-tauri/component-seeds -mindepth 1 -maxdepth 1 -delete
          cp apps/desktop-tauri/component-release/*.tar.zst apps/desktop-tauri/component-seeds/
          pnpm --dir apps/desktop-tauri run build:offline

      - name: Test relocated YourBuddy product runtime
        run: |
          harbor="$(find apps/desktop-tauri/component-release -type f -name 'yourbuddy-harbor-*.tar.zst' -print -quit)"
          test -n "$harbor"
          extracted="$RUNNER_TEMP/yourbuddy-harbor"
          mkdir -p "$extracted"
          tar -xaf "$harbor" -C "$extracted"
          bundled="$extracted"
          relocated="$RUNNER_TEMP/yourbuddy-runtime-relocated"
          ditto "$bundled" "$relocated"
          cp -L "$relocated/venv/bin/python" "$RUNNER_TEMP/yourbuddy-python-bundle-copy"
          rm "$relocated/venv/bin/python"
          mv "$RUNNER_TEMP/yourbuddy-python-bundle-copy" "$relocated/venv/bin/python"
          test ! -L "$relocated/venv/bin/python"
          sed -i '' 's|^home = .*|home = /private/nonexistent/yourbuddy-python/bin|' "$relocated/venv/pyvenv.cfg"
          env -u PYTHONHOME "$relocated/venv/bin/harbor" --version
          env -u PYTHONHOME "$relocated/venv/bin/harbor-dsh" --help >/dev/null

      - name: Stage release assets
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop-tauri/package.json | ConvertFrom-Json).version
          $bootstrapRoot = "$env:RUNNER_TEMP/bootstrap-bundle"
          $offlineRoot = "apps/desktop-tauri/src-tauri/target/$env:RUST_TARGET/release/bundle"
          New-Item -ItemType Directory -Force release-assets | Out-Null

          $bootstrapDmg = Get-ChildItem $bootstrapRoot -Recurse -File -Filter '*.dmg' | Select-Object -First 1
          $updater = Get-ChildItem $bootstrapRoot -Recurse -File -Filter '*.app.tar.gz' | Select-Object -First 1
          $offlineDmg = Get-ChildItem $offlineRoot -Recurse -File -Filter '*.dmg' | Select-Object -First 1
          if (-not $bootstrapDmg -or -not $updater -or -not $offlineDmg) { throw "Bootstrap, Offline, or updater artifact is missing" }
          $signature = Get-Item "$($updater.FullName).sig" -ErrorAction Stop

          Copy-Item $bootstrapDmg.FullName "release-assets/yourbuddy-$version-bootstrap-macos-arm64.dmg"
          Copy-Item $offlineDmg.FullName "release-assets/yourbuddy-$version-offline-macos-arm64.dmg"
          $updaterDestination = "release-assets/yourbuddy-$version-bootstrap-macos-arm64.app.tar.gz"
          Copy-Item $updater.FullName $updaterDestination
          Copy-Item $signature.FullName "$updaterDestination.sig"
          Copy-Item apps/desktop-tauri/component-release/*.tar.zst release-assets/
          Copy-Item "apps/desktop-tauri/component-release/yourbuddy-components-$version.json" release-assets/
          Copy-Item "apps/desktop-tauri/component-release/yourbuddy-components-$version.json.sig" release-assets/
          Copy-Item "apps/desktop-tauri/component-release/yourbuddy-size-report-$version.json" release-assets/

      - name: Generate updater manifest
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop-tauri/package.json | ConvertFrom-Json).version
          $publishedAt = (Get-Date).ToUniversalTime().ToString('o')
          node apps/desktop-tauri/scripts/generate-updater-manifest.mjs `
            --assets-dir release-assets `
            --output release-assets/latest.json `
            --version $version `
            --repository $env:GITHUB_REPOSITORY `
            --release-tag $env:RELEASE_TAG `
            --notes-file apps/desktop-tauri/release-notes.md `
            --pub-date $publishedAt

      - name: Generate and verify release checksums
        shell: pwsh
        run: |
          Get-ChildItem release-assets -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -NoNewline:$false release-assets/SHA256SUMS.txt
          Push-Location release-assets
          shasum -a 256 --check SHA256SUMS.txt
          Pop-Location

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "YourBuddy ${RELEASE_TAG#yourbuddy-v}" --notes-file apps/desktop-tauri/release-notes.md --latest

          if gh release view yourbuddy-updater >/dev/null 2>&1; then
            gh release upload yourbuddy-updater release-assets/latest.json --clobber
          else
            gh release create yourbuddy-updater release-assets/latest.json --target "$(git rev-parse HEAD)" --title "YourBuddy update channel" --notes "Signed macOS arm64 update manifest." --prerelease
          fi
